name: Fork release

# Builds, signs and publishes this fork's Windows x64, Linux x64, macOS
# arm64/x64 and Android arm64 release. Pushing a tag vX.Y.Z-rc.N runs it end to
# end (see docs/fork-releases.md).
#
# - windows, linux, macos, android: build and verify each platform in parallel and keep
#   the assets as workflow artifacts. They have no access to any signing key
#   and only a read token, so the build tools and npm dependencies they run
#   never see a key and cannot change a release. linux also runs a real update
#   from an older AppImage to the new one.
# - macos-sign: the only job in the fork-macos Environment, which holds the
#   macOS primary signing key. It installs nothing and runs only the
#   repository's dependency-free scripts from the workflow commit: it signs
#   both unsigned apps (and a built update predecessor) with the self-signed
#   certificate pinned in fork-config.mjs and packs the zips and disk images.
# - macos-verify: launches the signed apps and runs a real update from an
#   older signed app to the new one, on each architecture.
# - android-sign: the only job in the fork-android Environment, which holds
#   the fork keystore. It installs nothing, signs the APK and checks that the
#   fork certificate is its only signer.
# - draft: once all pass, uploads all assets as an unsigned Draft
#   pre-release. It installs and runs nothing from the repository.
# - publish: the only job in the fork-release Environment, which holds the
#   primary key. It installs nothing and runs only the repository's
#   dependency-free scripts from the workflow commit: it signs
#   latest-windows.json, re-downloads and audits every asset exactly as a
#   client would, then publishes. Any failure leaves a Draft (or no release),
#   which the updater never sees. The cold backup key never enters GitHub.
on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished tag vX.Y.Z-rc.N to rebuild, sign and publish
        required: true

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'lauchiwa/edgeever'
    name: Build Windows x64 Draft
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fork-release-version.mjs check "${TAG}"
          git fetch origin main
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || {
            echo "::error::${TAG} is not on main. Release only reviewed, merged commits."; exit 1; }
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::${TAG} is already published; a published release is never rebuilt."; exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          }

      # Gates check the reviewed source exactly as tagged, before anything is rewritten.
      - name: Release gates
        shell: bash
        env:
          EDGE_EVER_FORK_RELEASE: "1"
        run: |
          set -euo pipefail
          bun test scripts/fork-invariants.test.mjs scripts/windows-update-metadata.test.mjs \
            apps/desktop/src/main/windows-update-trust.test.mjs
          bun test --cwd apps/desktop src/main/acp-host-native.test.mjs src/main/acp-windows-command.test.mjs \
            src/main/acp-process-lifecycle.test.mjs src/main/claude-acp-compat.test.mjs
          bun run typecheck

      # main keeps the bare upstream version; the release version comes from the tag.
      - name: Apply the release version
        shell: bash
        run: node scripts/fork-release-version.mjs apply "${TAG}"

      - name: Build Web renderer
        env:
          EDGE_EVER_DESKTOP_BUILD: "1"
        run: bun run build:web

      - name: Build x64 Rust sidecar
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release

      - name: Package Windows installer
        env:
          EDGE_EVER_DESKTOP_ARCH: x64
          EDGE_EVER_DESKTOP_TARGET: win
        run: bun scripts/run-desktop-builder.mjs --publish never

      - name: Verify package and first launch
        shell: bash
        env:
          EDGE_EVER_DESKTOP_ARCH: x64
          EDGE_EVER_VERIFY_TARGET: win32
        run: |
          set -euo pipefail
          bun scripts/verify-desktop-package.mjs
          bun run verify:packaged-desktop-startup -- release/desktop/win-unpacked/EdgeEver.exe

      - name: Create unsigned update metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="${RUNNER_TEMP}/fork-release"
          mkdir -p "${stage}"
          cp "release/desktop/EdgeEver-${version}-windows-x64.exe" "${stage}/"
          node scripts/create-windows-update-metadata.mjs "${stage}" "${version}"
          ls -la "${stage}"

      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-windows
          path: ${{ runner.temp }}/fork-release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    if: github.repository == 'lauchiwa/edgeever'
    name: Build Linux x64 AppImage
    # The Rust sidecar is dynamically linked; the oldest supported runner keeps
    # its glibc requirement at or below 2.35, as upstream's Linux Preview does.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          node scripts/fork-release-version.mjs check "${TAG}"
          git fetch origin main
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || {
            echo "::error::${TAG} is not on main. Release only reviewed, merged commits."; exit 1; }
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::${TAG} is already published; a published release is never rebuilt."; exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install AppImage runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            [ "$attempt" = "3" ] && exit 1
            sleep "$((15 * attempt))"
          done

      # Gates check the reviewed source exactly as tagged, before anything is rewritten.
      - name: Release gates
        env:
          EDGE_EVER_FORK_RELEASE: "1"
        run: |
          set -euo pipefail
          bun test scripts/fork-invariants.test.mjs scripts/fork-linux-release.test.mjs \
            scripts/linux-update-release.test.mjs

      # main keeps the bare upstream version; the release version comes from the tag.
      - name: Apply the release version
        run: node scripts/fork-release-version.mjs apply "${TAG}"

      - name: Build Web renderer
        env:
          EDGE_EVER_DESKTOP_BUILD: "1"
        run: bun run build:web

      - name: Build x64 Rust sidecar
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release

      # The update gate starts from the previous published fork AppImage, as
      # installed clients do. Before any exists, it builds this source at an
      # older rc version, so the first Linux release still replaces a real one.
      - name: Get the update predecessor
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/EdgeEver-linux-update-source.AppImage"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/releases.json"
          previous="$(node -e '
            const releases = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).flat();
            const found = releases.find((release) => !release.draft && release.tag_name !== process.argv[2]
              && release.assets.some((asset) => /^EdgeEver-.+-linux-x64\.AppImage$/.test(asset.name)));
            process.stdout.write(found ? found.tag_name : "");
          ' "${RUNNER_TEMP}/releases.json" "${TAG}")"
          if [[ -n "${previous}" ]]; then
            directory="${RUNNER_TEMP}/previous-linux"
            gh release download "${previous}" -R "${GITHUB_REPOSITORY}" --dir "${directory}" \
              -p "EdgeEver-${previous#v}-linux-x64.AppImage" -p SHA256SUMS-linux.txt
            (cd "${directory}" && sha256sum --check SHA256SUMS-linux.txt)
            mv "${directory}/EdgeEver-${previous#v}-linux-x64.AppImage" "${source}"
          else
            previous="v0.0.1-rc.0 (built from this source)"
            backup="${RUNNER_TEMP}/edgeever-desktop-package.json"
            cp apps/desktop/package.json "${backup}"
            trap 'cp "${backup}" apps/desktop/package.json' EXIT
            node -e '
              const fs = require("fs");
              const path = "apps/desktop/package.json";
              const text = fs.readFileSync(path, "utf8");
              const { version } = JSON.parse(text);
              fs.writeFileSync(path, text.replace(`"version": "${version}"`, "\"version\": \"0.0.1-rc.0\""));
            '
            grep -q '"version": "0.0.1-rc.0"' apps/desktop/package.json
            EDGE_EVER_DESKTOP_ARCH=x64 EDGE_EVER_DESKTOP_TARGET=linux bun scripts/run-desktop-builder.mjs --publish never
            mv release/desktop/EdgeEver-0.0.1-rc.0-linux-x64.AppImage "${source}"
          fi
          chmod +x "${source}"
          echo "Update predecessor: ${previous}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Package Linux AppImage
        env:
          EDGE_EVER_DESKTOP_ARCH: x64
          EDGE_EVER_DESKTOP_TARGET: linux
        run: bun scripts/run-desktop-builder.mjs --publish never

      - name: Verify package and first launch
        env:
          EDGE_EVER_DESKTOP_ARCH: x64
          EDGE_EVER_VERIFY_TARGET: linux
          EDGE_EVER_SIDECAR_PATH: ${{ github.workspace }}/release/desktop/linux-unpacked/resources/sidecar/edgeever-sidecar
          EDGE_EVER_MIGRATIONS_PATH: ${{ github.workspace }}/release/desktop/linux-unpacked/resources/migrations
        run: |
          set -euo pipefail
          bun scripts/verify-desktop-package.mjs
          bun scripts/test-desktop-sidecar.mjs
          xvfb-run -a bun run verify:packaged-desktop-startup -- release/desktop/linux-unpacked/EdgeEver
          xvfb-run -a bun run verify:desktop-protocol-e2e -- release/desktop/linux-unpacked/EdgeEver

      - name: Stage Linux assets
        run: |
          set -euo pipefail
          node scripts/fork-linux-release.mjs stage release/desktop "${RUNNER_TEMP}/fork-release" "${TAG#v}"
          (cd "${RUNNER_TEMP}/fork-release" && sha256sum --check SHA256SUMS-linux.txt)
          ls -la "${RUNNER_TEMP}/fork-release"

      - name: Verify real AppImage automatic update
        run: |
          xvfb-run -a bun scripts/fork-verify-linux-appimage-update.mjs \
            "${RUNNER_TEMP}/EdgeEver-linux-update-source.AppImage" "${RUNNER_TEMP}/fork-release" "${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-linux
          path: ${{ runner.temp }}/fork-release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    if: github.repository == 'lauchiwa/edgeever'
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            unpacked: mac-arm64
          - arch: x64
            runner: macos-15-intel
            unpacked: mac
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      ARCH: ${{ matrix.arch }}
      UNPACKED: ${{ matrix.unpacked }}
      # No Developer ID: electron-builder leaves the app unsigned and macos-sign signs it.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          node scripts/fork-release-version.mjs check "${TAG}"
          git fetch origin main
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || {
            echo "::error::${TAG} is not on main. Release only reviewed, merged commits."; exit 1; }
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::${TAG} is already published; a published release is never rebuilt."; exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            [ "$attempt" = "3" ] && exit 1
            sleep "$((15 * attempt))"
          done

      # Gates check the reviewed source exactly as tagged, before anything is rewritten.
      - name: Release gates
        env:
          EDGE_EVER_FORK_RELEASE: "1"
        run: |
          set -euo pipefail
          bun test scripts/fork-invariants.test.mjs scripts/fork-macos-release.test.mjs

      # main keeps the bare upstream version; the release version comes from the tag.
      - name: Apply the release version
        run: node scripts/fork-release-version.mjs apply "${TAG}"

      - name: Build Web renderer
        env:
          EDGE_EVER_DESKTOP_BUILD: "1"
        run: bun run build:web

      - name: Build ${{ matrix.arch }} Rust sidecar
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release

      # The update gate starts from the previous published fork zip for this
      # architecture, as installed clients do. Before one exists, it builds this
      # source at an older rc version (signed by macos-sign), so the first macOS
      # release still replaces a real one.
      - name: Get the update predecessor
        run: |
          set -euo pipefail
          build="${RUNNER_TEMP}/fork-macos"
          mkdir -p "${build}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/releases.json"
          previous="$(node -e '
            const releases = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).flat();
            const pattern = new RegExp(`^EdgeEver-.+-mac-${process.argv[3]}\\.zip$`);
            const found = releases.find((release) => !release.draft && release.tag_name !== process.argv[2]
              && release.assets.some((asset) => pattern.test(asset.name)));
            process.stdout.write(found ? found.tag_name : "");
          ' "${RUNNER_TEMP}/releases.json" "${TAG}" "${ARCH}")"
          if [[ -n "${previous}" ]]; then
            source=release
            version="${previous#v}"
            directory="${RUNNER_TEMP}/previous-macos"
            name="EdgeEver-${version}-mac-${ARCH}.zip"
            gh release download "${previous}" -R "${GITHUB_REPOSITORY}" --dir "${directory}" \
              -p "${name}" -p SHA256SUMS-macos.txt
            line="$(awk -v name="${name}" '$2 == name' "${directory}/SHA256SUMS-macos.txt")"
            [[ -n "${line}" ]] || { echo "::error::${name} is not listed in SHA256SUMS-macos.txt"; exit 1; }
            (cd "${directory}" && printf '%s\n' "${line}" | shasum -a 256 -c -)
            mv "${directory}/${name}" "${build}/predecessor.zip"
          else
            source=built
            version=0.0.1-rc.0
            previous="v0.0.1-rc.0 (built from this source)"
            backup="${RUNNER_TEMP}/edgeever-desktop-package.json"
            cp apps/desktop/package.json "${backup}"
            trap 'cp "${backup}" apps/desktop/package.json' EXIT
            node -e '
              const fs = require("fs");
              const path = "apps/desktop/package.json";
              const text = fs.readFileSync(path, "utf8");
              const { version } = JSON.parse(text);
              fs.writeFileSync(path, text.replace(`"version": "${version}"`, "\"version\": \"0.0.1-rc.0\""));
            '
            grep -q '"version": "0.0.1-rc.0"' apps/desktop/package.json
            EDGE_EVER_DESKTOP_TARGET=mac EDGE_EVER_DESKTOP_ARCH="${ARCH}" bun scripts/run-desktop-builder.mjs --publish never
            ditto -c -k --sequesterRsrc --keepParent "release/desktop/${UNPACKED}/EdgeEver.app" "${build}/predecessor.zip"
            rm -rf release/desktop
          fi
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ source: process.argv[2], version: process.argv[3] }))' \
            "${build}/predecessor.json" "${source}" "${version}"
          echo "Update predecessor (${ARCH}): ${previous}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Package macOS app
        env:
          EDGE_EVER_DESKTOP_ARCH: ${{ matrix.arch }}
          EDGE_EVER_DESKTOP_TARGET: mac
        run: bun scripts/run-desktop-builder.mjs --publish never

      # Before verify-desktop-package, which removes the unpacked app.
      - name: Keep the unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "release/desktop/${UNPACKED}/EdgeEver.app" \
            "${RUNNER_TEMP}/fork-macos/EdgeEver.app.zip"

      # Launch tests run in macos-verify, on the signed app that ships.
      - name: Verify package
        env:
          EDGE_EVER_DESKTOP_ARCH: ${{ matrix.arch }}
          EDGE_EVER_VERIFY_TARGET: darwin
        run: bun scripts/verify-desktop-package.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: fork-macos-build-${{ matrix.arch }}
          path: ${{ runner.temp }}/fork-macos/*
          if-no-files-found: error
          retention-days: 7

  macos-sign:
    if: github.repository == 'lauchiwa/edgeever'
    name: Sign macOS apps
    needs: macos
    runs-on: macos-15
    timeout-minutes: 30
    environment: fork-macos
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # The signing tools come from the workflow commit (the tag itself, or
      # main for a manual run), never from an arbitrary input ref.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v7
        with:
          name: fork-macos-build-arm64
          path: ${{ runner.temp }}/builds/arm64
      - uses: actions/download-artifact@v7
        with:
          name: fork-macos-build-x64
          path: ${{ runner.temp }}/builds/x64

      - name: Sign and pack
        env:
          SIGNING_KEY_PEM: ${{ secrets.FORK_MACOS_SIGNING_KEY }}
          EDGE_EVER_MACOS_SIGNING_PASSPHRASE: ${{ secrets.FORK_MACOS_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_PEM}" ]]; then
            echo "::error::Add the FORK_MACOS_SIGNING_KEY secret to the fork-macos environment (docs/fork-releases.md)."; exit 1
          fi
          key="${RUNNER_TEMP}/macos-signing-key.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077; printf '%s\n' "${SIGNING_KEY_PEM}" > "${key}")
          EDGE_EVER_MACOS_SIGNING_KEY="${key}" node scripts/fork-macos-release.mjs sign-release \
            "${RUNNER_TEMP}/builds" "${RUNNER_TEMP}/fork-release" "${RUNNER_TEMP}/predecessors" "${TAG#v}"
          ls -la "${RUNNER_TEMP}/fork-release"

      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-macos
          path: ${{ runner.temp }}/fork-release/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: fork-macos-predecessors
          path: ${{ runner.temp }}/predecessors/*
          if-no-files-found: error
          retention-days: 7

  macos-verify:
    if: github.repository == 'lauchiwa/edgeever'
    name: Verify signed macOS ${{ matrix.arch }}
    needs: macos-sign
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      # The same commit as macos-sign, so both check the same pinned certificates.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@v7
        with:
          name: fork-release-macos
          path: ${{ runner.temp }}/fork-release
      - uses: actions/download-artifact@v7
        with:
          name: fork-macos-predecessors
          path: ${{ runner.temp }}/predecessors

      - name: Check the signed assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="${RUNNER_TEMP}/fork-release"
          node scripts/fork-macos-release.mjs verify "${stage}" "${version}"
          (cd "${stage}" && shasum -a 256 -c SHA256SUMS-macos.txt)
          node scripts/fork-macos-release.mjs check-dmg "${stage}/EdgeEver-${version}-mac-${ARCH}.dmg" "${version}" "${ARCH}"
          node scripts/fork-macos-release.mjs check-zip "${stage}/EdgeEver-${version}-mac-${ARCH}.zip" \
            "${RUNNER_TEMP}/signed" "${version}" "${ARCH}"

      - name: Verify first launch of the signed app
        env:
          EDGE_EVER_DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run verify:packaged-desktop-startup -- "${RUNNER_TEMP}/signed/EdgeEver.app/Contents/MacOS/EdgeEver"
          bun run verify:desktop-protocol-e2e -- "${RUNNER_TEMP}/signed/EdgeEver.app/Contents/MacOS/EdgeEver"

      - name: Verify real automatic update
        run: |
          bun scripts/fork-verify-macos-app-update.mjs \
            "${RUNNER_TEMP}/predecessors/${ARCH}.zip" "${RUNNER_TEMP}/fork-release" "${TAG#v}" "${ARCH}"

  android:
    if: github.repository == 'lauchiwa/edgeever'
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          node scripts/fork-release-version.mjs check "${TAG}"
          git fetch origin main
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main || {
            echo "::error::${TAG} is not on main. Release only reviewed, merged commits."; exit 1; }
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::${TAG} is already published; a published release is never rebuilt."; exit 1
          fi

      # Same build as fork-android.yml; signed only with the template's debug key.
      - uses: ./.github/actions/fork-android-build
        with:
          artifact-name: fork-android-unsigned

  # The only job in the fork-android Environment, which holds the fork
  # keystore. Like macos-sign it installs nothing and runs only the workflow
  # commit's dependency-free scripts.
  android-sign:
    if: github.repository == 'lauchiwa/edgeever'
    name: Sign Android APK
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fork-android
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: fork-android-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Sign with the fork keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Set the FORK_ANDROID_KEYSTORE_BASE64 secret in the fork-android environment}"
          : "${KEYSTORE_PASSWORD:?Set the FORK_ANDROID_KEYSTORE_PASSWORD secret in the fork-android environment}"
          umask 077
          keystore="${RUNNER_TEMP}/fork-android.p12"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "${apksigner}" sign --ks "${keystore}" --ks-type PKCS12 --ks-key-alias edgeever-fork \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "${RUNNER_TEMP}/signed.apk" "${RUNNER_TEMP}/unsigned/app-release.apk"
      # Fails unless the APK carries exactly one signer: the fork's own certificate.
      - name: Verify the signer and stage the APK
        env:
          EDGE_EVER_ANDROID_ALLOWED_SIGNER_SHA256: ${{ vars.FORK_ANDROID_SIGNER_SHA256 }}
        run: node scripts/fork-android-release.mjs stage "${RUNNER_TEMP}/signed.apk" "${RUNNER_TEMP}/fork-release" "${TAG#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-android
          path: ${{ runner.temp }}/fork-release/*
          if-no-files-found: error
          retention-days: 7

  draft:
    if: github.repository == 'lauchiwa/edgeever'
    name: Upload Draft pre-release
    needs: [windows, linux, macos-verify, android-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: fork-release-*
          merge-multiple: true
          path: ${{ runner.temp }}/fork-release

      - name: Upload Draft pre-release
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="${RUNNER_TEMP}/fork-release"
          base="${version%-rc.*}"
          ls -la "${stage}"
          # Which file to download per platform; the rest only serves installed apps.
          notes="$(cat <<NOTES
          ## 主要更新

          - 基于上游 EdgeEver v${base} 的二开版本（Windows x64、Linux x64 AppImage、macOS arm64/x64、Android arm64）。

          ## 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows x64 | \`EdgeEver-${version}-windows-x64.exe\` |
          | macOS（Apple 芯片） | \`EdgeEver-${version}-mac-arm64.dmg\` |
          | macOS（Intel） | \`EdgeEver-${version}-mac-x64.dmg\` |
          | Linux x64 | \`EdgeEver-${version}-linux-x64.AppImage\` |
          | Android arm64 | \`EdgeEver-${version}-android-arm64.apk\`（首次安装需先卸载上游应用） |

          其余文件（\`rc*.yml\`、\`latest-windows.json*\`、macOS 的 \`.zip\`、\`SHA256SUMS-*.txt\`）供已安装的桌面端自动更新和校验使用，无需下载。

          ## Key Changes

          - Fork build of this repository, synced from upstream EdgeEver v${base} (Windows x64, Linux x64 AppImage, macOS arm64/x64, Android arm64).

          ## Downloads

          | Platform | File |
          | --- | --- |
          | Windows x64 | \`EdgeEver-${version}-windows-x64.exe\` |
          | macOS (Apple silicon) | \`EdgeEver-${version}-mac-arm64.dmg\` |
          | macOS (Intel) | \`EdgeEver-${version}-mac-x64.dmg\` |
          | Linux x64 | \`EdgeEver-${version}-linux-x64.AppImage\` |
          | Android arm64 | \`EdgeEver-${version}-android-arm64.apk\` (uninstall the upstream app before the first install) |

          The other files (\`rc*.yml\`, \`latest-windows.json*\`, the macOS \`.zip\` files, \`SHA256SUMS-*.txt\`) let installed desktop apps update and verify themselves; there is no need to download them.
          NOTES
          )"
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::${TAG} is already published; a published release is never rebuilt."; exit 1
            fi
            for asset in $(gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name'); do
              gh release delete-asset "${TAG}" "${asset}" -R "${GITHUB_REPOSITORY}" --yes
            done
            gh release edit "${TAG}" -R "${GITHUB_REPOSITORY}" --notes "${notes}"
          else
            gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" --draft --prerelease \
              --verify-tag --title "EdgeEver ${version}" --notes "${notes}"
          fi
          gh release upload "${TAG}" -R "${GITHUB_REPOSITORY}" "${stage}"/*

  publish:
    if: github.repository == 'lauchiwa/edgeever'
    name: Sign, audit and publish
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fork-release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The signing tools come from the workflow commit (the tag itself, or
      # main for a manual run), never from an arbitrary input ref.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Sign, audit and publish
        shell: bash
        env:
          SIGNING_KEY_PEM: ${{ secrets.FORK_WINDOWS_UPDATE_SIGNING_KEY }}
          EDGE_EVER_WINDOWS_UPDATE_SIGNING_PASSPHRASE: ${{ secrets.FORK_WINDOWS_UPDATE_SIGNING_PASSPHRASE }}
          # The audit re-checks the downloaded APK's signer with apksigner.
          EDGE_EVER_ANDROID_ALLOWED_SIGNER_SHA256: ${{ vars.FORK_ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_PEM}" ]]; then
            echo "::error::Add the FORK_WINDOWS_UPDATE_SIGNING_KEY secret to the fork-release environment (docs/fork-releases.md)."; exit 1
          fi
          key="${RUNNER_TEMP}/windows-update-signing-key.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077; printf '%s\n' "${SIGNING_KEY_PEM}" > "${key}")
          EDGE_EVER_WINDOWS_UPDATE_SIGNING_KEY="${key}" node scripts/fork-sign-release.mjs "${TAG}" --publish
          {
            echo "### Published ${TAG}"
            echo
            echo "Windows signed; Windows, Linux, macOS and Android assets audited from a fresh download; published as a pre-release."
          } >> "${GITHUB_STEP_SUMMARY}"
